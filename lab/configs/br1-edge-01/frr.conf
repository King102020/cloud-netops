! br1-edge-01 — branch router, OSPF ABR (area 0 WAN / area 1 br1 LANs).
! eth3 = VLAN 10, eth4 = VLAN 30, mgmt99 (dummy) = VLAN 99.
! Mirrors packet-tracer/configs/br1-edge-01.ios. Source: docs/network-design.md
frr version 10.2.1
frr defaults traditional
hostname br1-edge-01
log stdout informational
service integrated-vtysh-config
!
interface lo
 ip address 10.255.255.3/32
 ip ospf area 0
!
interface eth1
 description WAN to hq-core-01 eth2
 ip address 10.255.0.6/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
 no ip ospf passive
!
interface eth2
 description BACKUP to br2-edge-01 eth2
 ip address 10.255.0.13/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 100
 no ip ospf passive
!
interface eth3
 description GW VLAN 10 USERS
 ip address 10.20.10.1/24
 ip ospf area 1
!
interface eth4
 description GW VLAN 30 GUEST
 ip address 10.20.30.1/24
 ip ospf area 1
!
interface mgmt99
 description GW VLAN 99 MGMT
 ip address 10.20.99.1/27
 ip ospf area 1
!
router ospf
 ospf router-id 10.255.255.3
 auto-cost reference-bandwidth 10000
 passive-interface default
 area 1 range 10.20.0.0/16
!
line vty
!
