! hq-core-01 — L3 core, WAN hub. VLAN gateways are Linux interfaces:
! eth4 = VLAN 10, br20 (eth5 + eth8) = VLAN 20, eth6 = VLAN 30, eth7 = VLAN 99.
! Mirrors packet-tracer/configs/hq-core-01.ios. Source: docs/network-design.md
frr version 10.2.1
frr defaults traditional
hostname hq-core-01
log stdout informational
service integrated-vtysh-config
!
interface lo
 ip address 10.255.255.2/32
 ip ospf area 0
!
interface eth1
 description TRANSIT to hq-edge-01 eth2
 ip address 10.255.0.2/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 1
 no ip ospf passive
!
interface eth2
 description WAN to br1-edge-01 eth1
 ip address 10.255.0.5/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
 no ip ospf passive
!
interface eth3
 description WAN to br2-edge-01 eth1
 ip address 10.255.0.9/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
 no ip ospf passive
!
interface eth4
 description GW VLAN 10 USERS
 ip address 10.10.10.1/24
 ip ospf area 0
!
interface br20
 description GW VLAN 20 SERVERS (bridge of eth5 + eth8)
 ip address 10.10.20.1/24
 ip ospf area 0
!
interface eth6
 description GW VLAN 30 GUEST
 ip address 10.10.30.1/24
 ip ospf area 0
!
interface eth7
 description GW VLAN 99 MGMT
 ip address 10.10.99.1/27
 ip ospf area 0
!
router ospf
 ospf router-id 10.255.255.2
 auto-cost reference-bandwidth 10000
 passive-interface default
!
line vty
!
