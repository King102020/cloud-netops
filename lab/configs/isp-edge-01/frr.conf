! isp-edge-01 — simulated ISP. No OSPF and no routes to 10.0.0.0/8:
! the company is only visible as 203.0.113.2 (hq-edge-01 PAT).
frr version 10.2.1
frr defaults traditional
hostname isp-edge-01
log stdout informational
service integrated-vtysh-config
!
interface eth1
 description Customer cnops hq-edge-01 eth1
 ip address 203.0.113.1/30
!
interface eth2
 description Simulated internet (isp-srv-01)
 ip address 198.51.100.1/24
!
line vty
!
