! hq-edge-01 — internet edge, NAT (iptables, see init.sh), OSPF ASBR
! Mirrors packet-tracer/configs/hq-edge-01.ios. Source: docs/network-design.md
frr version 10.2.1
frr defaults traditional
hostname hq-edge-01
log stdout informational
service integrated-vtysh-config
!
interface lo
 ip address 10.255.255.1/32
 ip ospf area 0
!
interface eth1
 description OUTSIDE to isp-edge-01 eth1
 ip address 203.0.113.2/30
!
interface eth2
 description INSIDE to hq-core-01 eth1
 ip address 10.255.0.1/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 1
 no ip ospf passive
!
ip route 0.0.0.0/0 203.0.113.1
!
router ospf
 ospf router-id 10.255.255.1
 auto-cost reference-bandwidth 10000
 passive-interface default
 default-information originate
!
line vty
!
