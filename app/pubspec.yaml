name: cnops_app
description: "Cloud NetOps: manage the multi-site network from Android, iOS and Web."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  bloc: ^9.2.1
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.4
  go_router: ^17.2.3
  intl: ^0.20.2
  # Generator compatibility on Dart 3.9: bloc_test pins analyzer 7.x, so we use
  # the newest generators that still support it (json_serializable 6.9 needs
  # json_annotation 4.9; retrofit_generator 9.x needs retrofit 4.4).
  json_annotation: ">=4.9.0 <4.10.0"
  retrofit: ">=4.4.0 <4.5.0"
  uuid: ^4.6.0

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.5.4
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  json_serializable: ">=6.9.0 <6.10.0"
  mocktail: ^1.0.5
  retrofit_generator: ">=9.1.0 <10.0.0"
  swagger_parser: ^1.46.0

flutter:
  uses-material-design: true
  generate: true
