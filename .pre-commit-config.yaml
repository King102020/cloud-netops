# Pre-commit hooks (STANDARDS §1). Install once: `pre-commit install`.
# Run everything: `pre-commit run --all-files` (tool/check does this).
# Hooks only run when matching files exist, so later phases need no changes here.
default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        # Containerlab and some CI files use custom tags.
        args: [--unsafe]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
        exclude: \.pkt$
      - id: mixed-line-ending
        args: [--fix=no]
        exclude: \.(ps1|bat|cmd)$
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.5
    hooks:
      - id: terraform_fmt

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: dart-format
        name: dart format (app/)
        entry: dart format --output=none --set-exit-if-changed
        language: system
        files: ^app/.*\.dart$
        exclude: (\.g\.dart$|/l10n/gen/)
