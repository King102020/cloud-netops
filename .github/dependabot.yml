version: 2
updates:
  # One entry per ecosystem that has a manifest in the repo.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)

  - package-ecosystem: terraform
    directories: [/infra/envs/local]
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(infra)

  - package-ecosystem: pip
    directories: [/api, /lab]
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(api)

  - package-ecosystem: docker
    directories: [/api, /lab/images/frr]
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
