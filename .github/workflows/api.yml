# Control API gate (STANDARDS §5, §7, §8): ruff, mypy --strict, pytest >= 80%,
# OpenAPI drift, pip-audit; builds the API container image as an artifact.
name: api

on:
  pull_request:
    paths: ["api/**", "ruff.toml", "infra/envs/local/**", ".github/workflows/api.yml"]
  push:
    branches: [main]
    paths: ["api/**", "ruff.toml", "infra/envs/local/**", ".github/workflows/api.yml"]

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: Install
        run: |
          python -m venv api/.venv
          api/.venv/bin/pip install --upgrade pip "setuptools>=84.1"
          api/.venv/bin/pip install -e "api[dev]"
      - name: Quality gate
        run: ./api/check.sh
      - name: Coverage report
        if: always()
        working-directory: api
        run: .venv/bin/python -m pytest --cov-report=xml:coverage.xml -q
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-coverage
          path: api/coverage.xml
          if-no-files-found: ignore

  image:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          docker build -t cnops-api:${{ github.sha }} api
          docker run -d --name api -p 8000:8000 cnops-api:${{ github.sha }}
          for _ in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
          curl -sf localhost:8000/healthz
          docker save cnops-api:${{ github.sha }} | gzip > cnops-api.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: cnops-api-image
          path: cnops-api.tar.gz
          retention-days: 7
