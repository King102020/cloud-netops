# Terraform gate (STANDARDS §4, §7, §8). Offline checks always run; plan and
# apply run against a LocalStack service container when the repo secret
# LOCALSTACK_AUTH_TOKEN is set. There is NO real-AWS job until the owner
# approves the AWS phase (ADR 0001).
name: infra

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.17.2"
  TF_IN_AUTOMATION: "1"

jobs:
  static:
    name: fmt, validate, test, tflint, checkov, plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Quality gate (offline)
        run: ./infra/check.sh
      - name: Plan (offline; no data sources, so LocalStack is not needed)
        working-directory: infra/envs/local
        run: terraform plan -input=false -no-color -lock=false

  localstack:
    name: apply on LocalStack
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HAS_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN != '' }}
    services:
      localstack:
        image: localstack/localstack:latest
        ports: ["4566:4566"]
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          SERVICES: ec2,iam,sts,logs,route53,dynamodb
    steps:
      - name: Skip without a LocalStack token
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::LOCALSTACK_AUTH_TOKEN is not set; skipping apply on LocalStack."
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - uses: hashicorp/setup-terraform@v3
        if: env.HAS_TOKEN == 'true'
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Wait for LocalStack
        if: env.HAS_TOKEN == 'true'
        run: |
          for _ in $(seq 1 60); do curl -sf localhost:4566/_localstack/health && exit 0; sleep 2; done
          exit 1
      - name: Apply, re-plan (must be empty), destroy
        if: env.HAS_TOKEN == 'true'
        working-directory: infra/envs/local
        run: |
          terraform init -input=false -no-color
          terraform apply -auto-approve -input=false -no-color
          terraform plan -detailed-exitcode -input=false -no-color
          terraform destroy -auto-approve -input=false -no-color
